---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: wild
  namespace: team-wild
  labels:
    app: wild
    app.kubernetes.io/part-of: load-demo
spec:
  replicas: 12
  selector:
    matchLabels:
      app: wild
  template:
    metadata:
      labels:
        app: wild
        app.kubernetes.io/part-of: load-demo
    spec:
      terminationGracePeriodSeconds: 10
      containers:
      - name: worker
        image: registry.access.redhat.com/ubi9/python-311
        command:
        - python3
        - /app/worker.py
        env:
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        - name: DEPLOY_NAME
          value: wild
        ports:
        - containerPort: 8080
          name: http
        readinessProbe:
          httpGet:
            path: /healthz
            port: 8080
          periodSeconds: 5
        resources: {}
        volumeMounts:
        - name: app
          mountPath: /app
        securityContext:
          allowPrivilegeEscalation: false
          runAsNonRoot: true
          capabilities:
            drop:
            - ALL
          seccompProfile:
            type: RuntimeDefault
      volumes:
      - name: app
        configMap:
          name: worker-app
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: team-quota
  namespace: team-guarded
spec:
  hard:
    requests.cpu: '30'
    limits.cpu: '30'
    requests.memory: 60Gi
    limits.memory: 60Gi
    pods: '60'
---
apiVersion: v1
kind: LimitRange
metadata:
  name: team-defaults
  namespace: team-guarded
spec:
  limits:
  - type: Container
    default:
      cpu: 500m
      memory: 1Gi
    defaultRequest:
      cpu: 500m
      memory: 1Gi
    max:
      cpu: '2'
      memory: 4Gi
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: guarded
  namespace: team-guarded
spec:
  maxUnavailable: 25%
  selector:
    matchLabels:
      app: guarded
